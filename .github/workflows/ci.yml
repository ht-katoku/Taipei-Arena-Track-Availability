name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-preview:
    # Pull requests from this repo only: forks never receive the deploy token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy web Worker to preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:preview
      - name: Smoke test security headers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.PREVIEW_URL != ''
        run: |
          headers=$(curl -sS -D - -o /dev/null "$PREVIEW_URL")
          for name in content-security-policy strict-transport-security x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$name:" || { echo "missing header: $name"; exit 1; }
          done
          if echo "$headers" | grep -qi "^set-cookie:"; then echo "unexpected Set-Cookie"; exit 1; fi
